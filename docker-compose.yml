services:
  db:
    image: postgres:15-alpine
    container_name: zoo-postgres
    restart: always
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ZOOCONNECT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    networks:
      - zoo_network

  redis:
    image: redis:alpine
    container_name: zoo-redis
    restart: always
    ports:
      - "127.0.0.1:6500:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    networks:
      - zoo_network

  backend:
    build:
      context: ./zoo-backend
      dockerfile: Dockerfile
    container_name: zoo-backend
    restart: always
    env_file:
      - ./zoo-backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: python -c "import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    networks:
      - zoo_network

  frontend:
    build:
      context: ./zoo-frontend
      dockerfile: Dockerfile
    container_name: zoo-frontend
    restart: always
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000/zooconnect
    env_file:
      - ./zoo-frontend/.env
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: timeout 2 bash -c 'exec 3<>/dev/tcp/localhost/4200' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    networks:
      - zoo_network

networks:
  zoo_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
