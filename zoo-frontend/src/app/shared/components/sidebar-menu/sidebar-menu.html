<ul class="zoo-menu-list">
  @for (item of navigationItems(); track item.route) {
  <li>
    <div
      [routerLink]="!item.disabled ? item.route : null"
      routerLinkActive="active"
      class="nav-item"
      [class.disabled]="item.disabled"
      [pTooltip]="item.disabled ? (item.tooltip || (item.comingSoon ? 'Próximamente' : 'No disponible')) : item.tooltip"
      tooltipPosition="right"
      pRipple
    >
      <i [class]="item.icon"></i>
      <span>{{ item.text }}</span>

      @if (item.badge && !item.disabled) {
      <p-badge [value]="item.badge" styleClass="nav-badge" />
      } @if (item.comingSoon) {
      <p-badge value="Pronto" styleClass="coming-soon-badge" />
      }
    </div>

    @if (item.children?.length) {
    <ul class="zoo-submenu-list">
      @for (child of item.children; track child.route) {
      <li
        [routerLink]="!child.disabled ? child.route : null"
        routerLinkActive="active"
        class="nav-item sub-nav-item"
        [class.disabled]="child.disabled"
        [pTooltip]="child.disabled ? (child.tooltip || 'No disponible') : child.tooltip"
        tooltipPosition="right"
        pRipple
      >
        <i [class]="child.icon"></i>
        <span>{{ child.text }}</span>
      </li>
      }
    </ul>
    }
  </li>
  }
</ul>
