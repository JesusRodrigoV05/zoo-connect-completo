<p-card class="crear-usuario-card">
  <ng-template pTemplate="header">
    <div class="card-header tour-user-form-header">
      <div class="card-header-row">
        <h2>{{ pageTitle }}</h2>
        <p-button
          label="Tour guiado"
          icon="pi pi-question-circle"
          severity="contrast"
          [rounded]="true"
          (onClick)="startGuidedTour()"
        />
      </div>

      <p class="subtitle">Ingresa los datos del usuario</p>
    </div>
  </ng-template>

  <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()" class="usuario-form">
    <div class="form-grid">
      <div class="field">
        <p-floatlabel variant="on">
          <input
            id="email"
            pInputText
            type="email"
            formControlName="email"
            autocomplete="email"
          />

          <label for="email">Email</label>
        </p-floatlabel>

        @if (isInvalid('email')) {

        <ng-container
          [ngTemplateOutlet]="alerta"
          [ngTemplateOutletContext]="{fieldName: 'email'}"
        />

        }
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <input
            id="nombre"
            pInputText
            type="text"
            formControlName="nombre"
            autocomplete="given-name"
          />

          <label for="nombre">Nombre</label>
        </p-floatlabel>

        @if (isInvalid('nombre')) {

        <ng-container
          [ngTemplateOutlet]="alerta"
          [ngTemplateOutletContext]="{fieldName: 'nombre'}"
        />

        }
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <input
            id="apellido"
            pInputText
            type="text"
            formControlName="apellido"
            autocomplete="family-name"
          />

          <label for="apellido">Apellido</label>
        </p-floatlabel>

        @if (isInvalid('apellido')) {

        <ng-container
          [ngTemplateOutlet]="alerta"
          [ngTemplateOutletContext]="{fieldName: 'apellido'}"
        />

        }
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <input
            id="phoneNumber"
            pInputText
            type="tel"
            formControlName="phoneNumber"
            autocomplete="tel"
          />

          <label for="phoneNumber">Teléfono</label>
        </p-floatlabel>

        @if (isInvalid('phoneNumber')) {

        <ng-container
          [ngTemplateOutlet]="alerta"
          [ngTemplateOutletContext]="{fieldName: 'phoneNumber'}"
        />

        }
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <p-select
            id="rol"
            formControlName="rol"
            [options]="roleOptions()"
            optionLabel="label"
            optionValue="value"
            [pTooltip]="usuarioForm.get('rol')?.disabled ? 'No puedes editar tu propio rol' : ''"
            placeholder="Selecciona un rol"
          />

          <label for="rol">Rol</label>
        </p-floatlabel>

        @if (isInvalid('rol')) {

        <ng-container
          [ngTemplateOutlet]="alerta"
          [ngTemplateOutletContext]="{fieldName: 'rol'}"
        />

        }
      </div>
    </div>

    <div class="form-actions">
      <p-button
        type="button"
        label="Cancelar"
        [rounded]="true"
        severity="secondary"
        styleClass="tour-user-cancel-btn"
        (onClick)="onCancel()"
        [disabled]="isLoading()"
      />

      <p-button
        type="submit"
        [label]="buttonText"
        [rounded]="true"
        severity="primary"
        styleClass="tour-user-submit-btn"
        [loading]="isLoading()"
        [disabled]="usuarioForm.invalid || isLoading()"
      />
    </div>
  </form>
</p-card>

<ng-template #alerta let-fieldName="fieldName">
  <p-message severity="error" variant="simple" size="small">
    {{ getErrorMessage(fieldName) }}
  </p-message>
</ng-template>
