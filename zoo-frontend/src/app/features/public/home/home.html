<div class="home-page">
  <app-hero-section />

  @defer (on viewport) {
  <div class="tour-public-home-gallery">
    <app-carousel />
  </div>
  } @placeholder {
  <div class="placeholder placeholder--carousel"></div>
  } @defer (on viewport) {
  <div class="tour-public-home-programs">
    <app-services-section />
  </div>
  } @placeholder {
  <div class="placeholder placeholder--services"></div>
  } @defer (on viewport) {
  <div class="tour-public-home-news">
    <app-noticias-section />
  </div>
  } @placeholder {
  <div class="placeholder placeholder--news"></div>
  } @defer (on viewport) {
  <div class="tour-public-home-weather">
    <app-weather-section />
  </div>
  } @placeholder {
  <div class="placeholder placeholder--weather"></div>
  } @defer (on viewport) {
  <div class="tour-public-home-contact">
    <app-contact-section (submitContact)="onSubmitContact()" />
  </div>
  } @placeholder {
  <div class="placeholder placeholder--contact"></div>
  } @defer (on viewport) {
  <div class="tour-public-home-social">
    <app-social-section />
  </div>
  } @placeholder {
  <div class="placeholder placeholder--social"></div>
  }
</div>
